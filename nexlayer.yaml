# Nexlayer MCP Deployment YAML
pods:
  - name: frontend
    image: <IMAGE_URL_PLACEHOLDER>
    ports:
      - port: 80
        public: true
    env:
      # If your frontend needs to know its public URL, use the scriptlet below
      # VITE_PUBLIC_SITE_URL: "<% URL %>"
    healthcheck:
      path: /health
      interval: 30
      timeout: 5
      retries: 3
