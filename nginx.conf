# nginx.conf for Vite/React SPA on Nexlayer
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: serve static files from /public
    location /public/ {
        alias /usr/share/nginx/html/public/;
    }
}
